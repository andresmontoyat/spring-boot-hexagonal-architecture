# Build engine
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Project
version=2.0.0-SNAPSHOT

# Java toolchain
java.version=21

# Framework BOMs
spring.boot.version=4.0.8

# Private registries (NEVER commit credentials: GH_PACKAGES_USERNAME / GH_PACKAGES_TOKEN from env)
codehunters.sdk.repository.url=https://maven.pkg.github.com/Codehunters-IO/java-sdk
codehunters.sdk.bom.version=7.1.0

# Libraries
springdoc.version=3.0.3
archunit.version=1.5.1
karate.version=1.5.2
resilience4j.version=2.4.0
# Same version the outbox SDK (sdk-event-messaging-jdbc 9.1.0) brings: one ShedLock on the classpath.
shedlock.version=7.2.0
testcontainers.keycloak.version=4.4.0
google.java.format.version=1.28.0

# Quality gates
jacoco.minimum.line.coverage=0.80
